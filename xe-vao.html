<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhận Xe Vào Bãi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">🅿️ Quản Lý Bãi Xe</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Danh sách xe</a></li>
                    <li class="nav-item"><a class="nav-link active" href="xe-vao.html">Nhận xe vào</a></li>
                    <li class="nav-item"><a class="nav-link" href="thong-ke.html">Thống kê</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Form Ghi Nhận Xe Vào Bãi</h4>
                    </div>
                    <div class="card-body">
                        <form id="form-nhan-xe">
                            <div class="mb-3">
                                <label class="form-label">Biển số xe:</label>
                                <input type="text" id="input-bien-so" class="form-control" placeholder="Nhập biển số (VD: 29C1-56789)" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Loại xe:</label>
                                <select id="select-loai-xe" class="form-select">
                                    <option value="Xe máy">Xe máy (5.000đ/lượt)</option>
                                    <option value="Ô tô">Ô tô (30.000đ/lượt)</option>
                                    <option value="Xe đạp">Xe đạp (3.000đ/lượt)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Xác Nhận Xe Vào</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
