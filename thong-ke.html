<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống Kê Doanh Thu - Quản Lý Bãi Xe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">🅿️ Quản Lý Bãi Xe</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Danh sách xe</a></li>
                    <li class="nav-item"><a class="nav-link" href="xe-vao.html">Nhận xe vào</a></li>
                    <li class="nav-item"><a class="nav-link active" href="thong-ke.html">Thống kê</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Thống Kê Doanh Thu & Lượt Gửi Xe</h2>

        <div class="row text-white mb-4">
            <div class="col-md-4">
                <div class="card bg-success p-3">
                    <h5>Tổng doanh thu</h5>
                    <h3 id="stat-revenue">0 VNĐ</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-primary p-3">
                    <h5>Tổng lượt gửi xe</h5>
                    <h3 id="stat-turns">0 lượt</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-info p-3">
                    <h5>Xe đã hoàn thành</h5>
                    <h3 id="stat-completed">0 xe</h3>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Lịch Sử Các Xe Đã Ra Bãi</h5>
            </div>
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>STT</th>
                            <th>Biển số xe</th>
                            <th>Loại xe</th>
                            <th>Thời gian vào</th>
                            <th>Thời gian ra</th>
                            <th>Tiền thu</th>
                        </tr>
                    </thead>
                    <tbody id="table-history">
                        <!-- JS Render -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
